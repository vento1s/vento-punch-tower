.sndbtn:focus-visible{outline:3px dashed var(--gold);outline-offset:5px}
@media (prefers-reduced-motion:reduce){.pushtxt,.pusharrow{animation:none}}
.studio{font-family:var(--f-pixel);font-size:clamp(16px,6.5cqw,24px);line-height:1.6;letter-spacing:.08em;color:var(--gi);
  text-shadow:3px 3px 0 #c8341a,6px 6px 0 #4a1408;text-align:center;transition:color .05s,text-shadow .05s}
.studio span,.splash .w3{display:inline-block;animation:popin .14s steps(3) both}
.studio .w2{animation-delay:.16s}.splash .w3{animation-delay:.5s}
.studio.lit{color:#fff;text-shadow:3px 3px 0 #c8341a,6px 6px 0 #4a1408,0 0 14px rgba(255,208,74,.9)}
@keyframes popin{from{opacity:0;transform:scale(1.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.board li.me,.blinky,.studio span,.splash .w3,.namebox.bad{animation:none}}
.mash{position:absolute;left:0;right:0;bottom:26%;text-align:center;pointer-events:none;z-index:2;
  font-family:var(--f-display);font-size:clamp(34px,13cqw,52px);color:var(--gold);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),6px 6px 0 #c24e00;
  animation:mashShake .16s steps(2) infinite}
.mash[hidden]{display:none}
.finale{position:absolute;left:0;right:0;top:30%;display:grid;justify-items:center;gap:6px;pointer-events:none;z-index:2;animation:finIn 1.5s steps(30) forwards}
.finale[hidden]{display:none}
.finale b{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,12cqw,48px);color:var(--gold);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),6px 6px 0 #c24e00;
  animation:finHue .3s steps(3) infinite}
.finale i{font-style:normal;font-family:var(--f-display);font-size:18px;color:#fff;background:var(--weak);padding:4px 10px 3px;box-shadow:3px 3px 0 var(--ink)}
.finale i:empty{display:none}
.finale.big b{font-size:clamp(40px,15cqw,60px)}
@keyframes finIn{0%{transform:scale(2.2);opacity:0}8%{transform:scale(.9);opacity:1}14%{transform:scale(1.05)}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes finHue{0%{color:var(--gold)}33%{color:#fff}66%{color:#ff8a00}}
@media (prefers-reduced-motion:reduce){.finale,.finale b{animation:none}}
@keyframes mashShake{50%{transform:translate(3px,-2px) scale(1.06);color:#fff}}
@media (prefers-reduced-motion:reduce){.mash{animation:none}}
/* pause: small pixel 'II' button in the HUD gap between the difficulty tag and the clock */
.pausebtn{position:absolute;left:calc(91 / 144 * 100%);top:calc(5 / 256 * 100%);width:calc(17 / 144 * 100%);height:calc(17 / 256 * 100%);
  z-index:4;border:0;border-radius:0;padding:0;cursor:pointer;background:rgba(13,10,8,.7);
  box-shadow:0 -2px 0 0 var(--edge),0 2px 0 0 var(--edge),-2px 0 0 0 var(--edge),2px 0 0 0 var(--edge)}
.pausebtn[hidden]{display:none}
.pausebtn::before,.pausebtn::after{content:"";position:absolute;top:28%;height:44%;width:16%;background:var(--gi)}
.pausebtn::before{left:28%}.pausebtn::after{right:28%}
.pausebtn:active{background:var(--gold)}
.pausebtn:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.pmenu{width:calc(100% - 16px);max-width:260px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.cutin{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;z-index:2;overflow:hidden}
.cutin[hidden]{display:none}
.cutin .band{width:100%;padding:12px 0 8px;text-align:center;
  background:linear-gradient(90deg,#c8341a,#ff7a1a 35%,#ffd04a 55%,#ff7a1a 75%,#c8341a);
  box-shadow:0 6px 0 #4a1408,0 -6px 0 #4a1408;transform:skewY(-8deg);animation:cut .5s steps(7) forwards}
.cutin b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,17cqw,76px);line-height:1;color:#fff;
  text-shadow:4px 4px 0 #4a1408,-2px -2px 0 #c8341a}
.cutin i{display:block;font-family:var(--f-pixel);font-style:normal;font-size:9px;letter-spacing:.35em;color:#4a1408;margin-top:4px}
@keyframes cut{0%{transform:skewY(-8deg) translateX(-110%)}18%{transform:skewY(-8deg) translateX(0)}78%{transform:skewY(-8deg) translateX(0);opacity:1}100%{transform:skewY(-8deg) translateX(110%);opacity:0}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.cutin .band{animation:none}}

  else{if(bothT>0)kingGrowl(false);bothT=0;}
  if(dir&&mode==='play'&&!(hasL&&hasR))pl.tx+=Math.sign(dir)*MOVE_SPD*dt;
  pl.tx=clamp(pl.tx,XMIN,XMAX);

}

  for(let k=0;k<=h;k++){ell(cx,by-k,15,5,k<2?'#7a0a0a':'#b81010');}
  for(let k=1;k<=h;k++){g.fillStyle='#d81e1e';const y=by-k+4;g.fillRect(cx+2,y,12,1);} // lit right side of the wall
  ell(cx,by-h,15,5,'#ff2a2a');          // top face
  ell(cx-3,by-h-1,9,3,'#ff4d40');
  g.fillStyle='#ffb2a6';g.fillRect(cx-8,by-h-3,4,1);g.fillRect(cx-9,by-h-2,2,1); // glint
}
function animStartButton(c){
  const seq=[6,6,5,4,2,1,1,2,4,5];let i=0,run=true,forced=null;
  const tick=()=>{if(!run)return;drawStartButton(c,forced!==null?forced:seq[i++%seq.length]);setTimeout(tick,100);};
  tick();
  return pressNow=>{if(pressNow){forced=0;drawStartButton(c,0);}else run=false;};
}
function showSplash(){
  ov.classList.add('black');ov.hidden=false;
  ov.innerHTML=`<div class="arcade">
      <div class="pushcue" aria-hidden="true"><div class="pushtxt">PUSH! PUSH!</div><div class="pusharrow"></div></div>
      <button class="abtn" id="startbtn" type="button" aria-label="START"><canvas id="btncv" width="52" height="29"></canvas></button>
    </div>
    <button class="sndbtn${soundOn?'':' off'}" id="sndbtn" type="button" aria-pressed="${soundOn}"><i aria-hidden="true"></i><span>${soundLabel()}</span></button>`;
  let stage2=false,done=false;
  const finish=()=>{if(done)return;done=true;removeEventListener('keydown',onKey);ov.classList.remove('black');showTitle();};
  const play=()=>{
    if(stage2){finish();return;} // a second touch skips the logo
    stage2=true;initAudio();sfx.logo();
    ov.innerHTML=`<div class="splash"><div class="studio" id="studio"><span class="w1">VENTO</span><br><span class="w2">AI STUDIO</span></div><div class="hint w3">PRESENTS</div></div>`;
    setTimeout(()=>{const el=document.getElementById('studio');if(el&&!done)el.classList.add('lit');},440);
    setTimeout(()=>{const el=document.getElementById('studio');if(el&&!done)el.classList.remove('lit');},620);
    setTimeout(finish,2000);};
  const onKey=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}};
  const stopBtn=animStartButton(document.getElementById('btncv'));
  let pushed=false;
  document.getElementById('startbtn').addEventListener('click',e=>{e.stopPropagation();if(pushed)return;pushed=true;
    stopBtn(true);initAudio();sfx.select();setTimeout(play,170);});
  document.getElementById('sndbtn').addEventListener('click',e=>{e.stopPropagation();setSound(!soundOn);
    const b=e.currentTarget;b.classList.toggle('off',!soundOn);b.setAttribute('aria-pressed',soundOn);b.querySelector('span').textContent=soundLabel();
    if(soundOn){initAudio();sfx.select();}});
  // once the logo is playing, a tap anywhere skips it
  ov.addEventListener('pointerdown',function h(){if(done){ov.removeEventListener('pointerdown',h);return;}if(stage2)finish();});
  addEventListener('keydown',onKey);}
const togHTML=(id,act,label,on)=>`<button class="tog${on?'':' off'}" type="button" id="${id}" data-act="${act}" aria-pressed="${on}"><span>${label}</span><b>${on?'ON':'OFF'}</b></button>`;
function setTog(id,on){const b=ov.querySelector('#'+id);if(!b)return;b.classList.toggle('off',!on);b.setAttribute('aria-pressed',on);b.querySelector('b').textContent=on?'ON':'OFF';}
// title layout: one 296px column, everything on the same left/right edges.
// importance: START (big, full width) > ranking / how-to (medium pair) > guest, music, sound (small)
function showTitle(){menuMusic();showOverlay(`
  <h1 class="logo" aria-label="PUNCH TOWER"><span class="lw"><span class="lo" aria-hidden="true">PUNCH</span><span class="lf">PUNCH</span></span><span class="lw"><span class="lo" aria-hidden="true">TOWER</span><span class="lf">TOWER</span></span></h1>
  <div class="menu">
    <div class="sect">
      <label class="namebox" for="pname"><span>NAME</span><input id="pname" maxlength="${NAME_MAX}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="닉네임 (비우면 게스트)" value="${isGuest?'':esc(playerName)}"><button class="nameclear" id="nameclear" type="button" aria-label="닉네임 지우기"${(isGuest||!playerName)?" hidden":""}></button></label>
      <button class="ghost guest" type="button" data-act="guest">게스트로 플레이</button>
    </div>
    <div class="sect"><span class="lbl">난이도</span>${diffPicker()}</div>
    <div class="sect"><span class="lbl">조작 방식</span><div class="diff ctrl" role="group" aria-label="조작 방식">
      <button type="button" id="ctrl-classic" data-c="classic" aria-pressed="${ctrlMode==='classic'}">클래식</button>
      <button type="button" id="ctrl-pad" data-c="pad" aria-pressed="${ctrlMode==='pad'}">스틱+버튼</button></div></div>
    <button class="btn primary" id="go" data-act="go"><i aria-hidden="true">▶</i>시작</button>
    <div class="pair"><button class="btn2" type="button" data-act="rank">랭킹</button><button class="btn2" type="button" data-act="howto">조작법</button></div>
    <div class="tail">
      <div class="stat" id="bestline">${bestLine()}</div>
      <div class="togs">${togHTML('bgmbtn','music','음악',bgmOn)}${togHTML('sndlink','sound','소리',soundOn)}</div>
    </div>
  </div>
  ${CREDIT}`,{go:startGame,guest:startGuest,rank:()=>showRanking(),howto:showHowto,
    sound:()=>{setSound(!soundOn);setTog('sndlink',soundOn);if(soundOn){sfx.select();menuMusic();}},
    music:()=>{toggleBgm();setTog('bgmbtn',bgmOn);}});
  ov.querySelectorAll('.ctrl button').forEach(b=>b.addEventListener('click',()=>{initAudio();ctrlMode=b.dataset.c;
    try{localStorage.setItem('punchtower.ctrl',ctrlMode);}catch(e){}
    ov.querySelectorAll('.ctrl button').forEach(x=>x.setAttribute('aria-pressed',x===b));sfx.select();}));
  const inp=ov.querySelector('#pname');
  const clr=ov.querySelector('#nameclear');
  inp.addEventListener('input',()=>{playerName=inp.value.trim().slice(0,NAME_MAX);clr.hidden=!inp.value;});
  clr.addEventListener('click',e=>{e.preventDefault();inp.value='';playerName='';clr.hidden=true;
    try{localStorage.removeItem('punchtower.name');}catch(_){}sfx.same();inp.focus();});
  if(!playerName)setTimeout(()=>{try{inp.focus({preventScroll:true});}catch(e){}},80);}
function showHowto(){menuMusic();showOverlay(`
  <div class="eyebrow">HOW TO PLAY</div>
  <h2 class="big">조작법</h2>
  <ul class="rules win">
    <li><b>클래식</b>: 화면 <b>왼쪽 탭은 왼펀치</b>, <b>오른쪽 탭은 오른펀치</b></li>
    <li><b>스틱+버튼</b>: 왼쪽은 <b>드래그 스틱</b>으로 이동(툭 튕기면 대시), 오른쪽은 <b>L·R 주먹 버튼</b>. 버튼을 꾹 눌렀다 떼면 기 펀치, 둘 다 꾹 = 왕펀치</li>
    <li>클래식에서 <b>꾹 누르면</b> 그쪽으로 걸어가며 기가 모이고, <b>떼면</b> 모인 만큼 센 펀치</li>
    <li>걷는 중에 <b>반대쪽을 탭</b>하면 가던 방향으로 휙 <b>대시</b></li>
    <li><b class="w">빨간 약점</b> 아래에서 좌우 번갈아 치거나 기 펀치를 날리면 크게 깨져요</li>
    <li>약점을 <b>20번</b> 때리면 <b>왕펀치</b> 충전(쓸 때마다 10번씩 더 필요). 양쪽을 같이 꾹 누르면 5층 관통!</li>
    <li>약점이 아닌 곳은 단단해서 <b>3~5배</b> 더 때려야 깨져요. 25번째 약점 타격마다 <b>피버</b>!</li>
    <li>보랏빛 <b>비브라늄</b> 블록은 약점 말고는 아예 안 깨져요</li>
    <li>게임 중 위쪽 <b>II</b> 버튼으로 일시정지, 재시작, 메뉴로 갈 수 있어요</li>
    <li>탑은 끝이 없어요. 밑에서 <b>용암</b>이 올라갈수록 점점 더 빨라져요. 누가 더 높이 가나 대결!</li>
  </ul>
  <div class="hint">PC: ← → 펀치 · 꾹 = 이동 · ← + → 또는 ↑ 왕펀치</div>
  <button class="btn" type="button" data-act="back">돌아가기</button>
  ${CREDIT}`,{back:showTitle});}
function showRanking(){menuMusic();showOverlay(`
  <div class="eyebrow">HIGH SCORES</div>
  <h2 class="big">랭킹</h2>
  <div id="board" class="boardwrap"></div>
  ${SCORE_RULE}
  <button class="btn" type="button" data-act="back">돌아가기</button>
  ${CREDIT}`,{back:showTitle});
  fillBoard('#board');}
function resultScreen(cleared){
  setTimeout(()=>{if(!ov.hidden&&mode!=='play')menuMusic();},900); // after the death sting
  const floor=pl.level,time=Math.round((cleared?clearTime:tNow)*10)/10;
  const en={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:playerName||'???',diff:D.key,floor,time};
  const head=cleared
    ?`<div class="eyebrow">TOWER CLEAR · ${D.tag}</div><h2 class="big">정상 정복!</h2>`
    :`<h2 class="big over">GAME OVER</h2>`;
  showOverlay(`${head}
  <div class="win result">
    <div class="who"><b>${esc(en.name)}</b><span class="dchip d-${D.key}">${D.ko}</span></div>
    <div class="cells">
      <div class="cell"><i>FLOOR</i><span>${floor}F</span></div>
      <div class="cell"><i>TIME</i><span>${fmt(time)}</span></div>
      <div class="cell"><i>WEAK</i><span>${weakCount}</span></div>
      <div class="cell"><i>KING</i><span>${superCount}</span></div>
    </div>
    <div class="total"><i>SCORE</i><span>${num(scoreOf(en))}</span></div>
  </div>
  <div class="rankbig" id="myrank">${floor>=1?'기록 등록 중…':'1층은 넘어야 랭킹에 올라가요'}</div>
  <div id="board" class="boardwrap"></div>
  <button class="btn" id="go" data-act="go">${cleared?'한 판 더':'다시 갈기기'}</button>
  <div class="row"><button class="ghost" type="button" data-act="title">처음으로</button></div>
  ${CREDIT}`,{go:startGame,title:showTitle});
  const gen=ovGen;
  if(floor<1){fillBoard('#board');return;}
  submitScore(en).then(res=>{
    if(gen!==ovGen)return;
    const r=ov.querySelector('#myrank');
    if(r)r.innerHTML=res.rank===1?'<span class="blinky">★ NEW RECORD! 1ST ★</span>':res.rank?`RANK <b>${ord(res.rank)}</b>`:'';
    if(res.rank&&res.rank<=3)sfx.coin();
    fillBoard('#board',D.key,en.id,res);
  });
}
function showOver(){resultScreen(false);}
function showClear(){resultScreen(true);}
showSplash();
})();
</script>
